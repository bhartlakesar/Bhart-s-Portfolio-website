<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Weather App</title>
</head>

<body>
    <div class="main">
        <div class="weatherApp">
            <h1>Weather App</h1>
            <div class="searchCity">
                <input type="text" id="searchInput" placeholder="Enter City">
                <button>Search</button>
            </div>

            <div class="webInfo">


                <p class="location"><i class="fa-solid fa-location-dot"
                        style="color: #4d2bd0;"></i><span>---</span></p>


                <div class="info2">
                    <p class="weatherIcon">---</p>
                    <p class="temperature"><span>---</span></p>
                    <p class="condition">---</p>
                </div>

                <div class="info3">
                    <p class="humidity">Humidity <br><span>--</span></p>
                    <p class="wind">Wind <br><span>--</span></p>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
